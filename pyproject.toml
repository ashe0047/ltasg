[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[project]
name = "ltasg"
dynamic = ["version"]
authors = [
  { name="Aw Sheng Xiang", email="awshengxiang@hotmail.com" },
]
description = "Async Python client for Singapore's LTA DataMall API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: AsyncIO",
    "Typing :: Typed",
    "Topic :: Internet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
  "aiohttp >= 3.14.4"
]

[project.optional-dependencies]
dev = [
  "build >= 1.2",
  "mypy >= 1.15",
  "pip-audit >= 2.7",
  "pre-commit >= 4.0",
  "pytest >= 8.3",
  "pytest-asyncio >= 0.24",
  "pytest-timeout >= 2.3",
  "python-dotenv >= 1.2",
  "python-semantic-release == 10.6.1",
  "ruff == 0.15.21",
  "twine >= 6.1",
]

[project.urls]
Homepage = "https://pypi.org/project/ltasg/"
Repository = "https://github.com/ashe0047/ltasg"
Documentation = "https://datamall.lta.gov.sg/content/dam/datamall/datasets/LTA_DataMall_API_User_Guide.pdf?ref=public_apis"
Issues = "https://github.com/ashe0047/ltasg/issues"
Changelog = "https://github.com/ashe0047/ltasg/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/ltasg/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ltasg"]

[tool.hatch.build.targets.sdist]
exclude = ["/test", "/test/**"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "ltasg_e2e: opt-in live LTA DataMall end-to-end tests",
    "slow: paginated endpoints that take 30s+ to fetch all pages",
]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src/ltasg", "test"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "TID"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_unused_configs = true
explicit_package_bases = true
mypy_path = "src"
no_implicit_optional = false

[tool.semantic_release]
build_command = "python -m build"
commit_message = "chore(release): {version}"
major_on_zero = false
version_toml = []
version_variables = ["src/ltasg/__init__.py:__version__"]
tag_format = "v{version}"

[tool.semantic_release.branches.main]
match = "main"
