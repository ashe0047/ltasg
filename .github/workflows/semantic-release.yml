name: Semantic Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release:
    name: Create version and tag
    runs-on: ubuntu-latest
    concurrency: release
    permissions:
      contents: write
    steps:
      - name: Check semantic release token
        env:
          SEMANTIC_RELEASE_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: test -n "$SEMANTIC_RELEASE_TOKEN"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          # A PAT is required because GITHUB_TOKEN pushes do not trigger workflows.
          token: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install semantic-release
        run: python -m pip install 'python-semantic-release == 10.6.1'
      - name: Create version commit and tag
        env:
          GH_TOKEN: ${{ secrets.SEMANTIC_RELEASE_TOKEN }}
        run: |
          git config user.name "semantic-release"
          git config user.email "semantic-release"
          semantic-release version --no-vcs-release
